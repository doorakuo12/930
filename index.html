    <a href="https://dorakuostudio.vercel.app/p2.html" id="dvdLogo">

        </span>

    <!-- java互動 -->
    <script>
        const logo = document.getElementById("dvdLogo");

        let x = 100;
        let y = 100;
        let speedX = 2.5;
        let speedY = 2;

        function moveLogo() {
            // 修復：補上了缺少的減號
            const maxX = window.innerWidth - logo.offsetWidth;
            const maxY = window.innerHeight - logo.offsetHeight;

            x += speedX;
            y += speedY;

            // 左右邊界反彈
            if (x >= maxX || x <= 0) {
                speedX *= -1;
                x = Math.max(0, Math.min(x, maxX));
            }

            // 上下邊界反彈
            if (y >= maxY || y <= 0) {
                speedY *= -1;
                y = Math.max(0, Math.min(y, maxY));
            }

            logo.style.left = x + "px";
            logo.style.top = y + "px";

            requestAnimationFrame(moveLogo);
        }

        moveLogo();

        // 視窗縮放時重新限制位置
        window.addEventListener("resize", () => {
            // 修復：補上了缺少的減號
            x = Math.min(x, window.innerWidth - logo.offsetWidth);
            y = Math.min(y, window.innerHeight - logo.offsetHeight);
        });
    </script>
